[package]
name = "ironbark-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "ironbark-core"

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
rusqlite.workspace = true
sha2.workspace = true
schemars = { version = "1", features = ["uuid1"] }
ts-rs = { version = "11", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
libc = "0.2"
regex = "1"
fs2 = "0.4"
url = "2"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
base64 = "0.22"
tempfile = "3"
[dev-dependencies]
tempfile = "3"
