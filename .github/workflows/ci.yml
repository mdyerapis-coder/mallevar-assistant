# Minimal CI: the same checks the repo runs locally (see README.md).
# Rust 1.98.1 is pinned by rust-toolchain.toml; Bun 1.4.4 matches the
# locally verified toolchain. The managed_worker tests need the exact
# local Bun runtime via IRONBARK_TEST_BUN, and the lifecycle tests shell
# out to the built CLI binary, so both are set up before cargo test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri + bubblewrap)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Resolve Bun path for managed_worker tests
        run: echo "IRONBARK_TEST_BUN=$(readlink -f "$(which bun)")" >> "$GITHUB_ENV"

      - name: Build CLI binaries (lifecycle-test precondition)
        run: cargo build -p ironbark-core -p ironbark-cli

      - name: Cargo tests
        run: cargo test --workspace

      - name: Bun tests
        run: |
          bun install --ignore-scripts
          bun test packages/adapters/test

      - name: Typecheck
        run: bunx tsc --noEmit --strict

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings
